# Painel do Payload CMS no MESMO domínio do site: https://portal.cambui.mg.gov.br/cms
# (sem subdomínio novo: DNS e Caddy continuam como estão). Incluído pelo server{} do portal em conf.d/10-http.conf.
#
# O Payload roda em 127.0.0.1:3000 com basePath '/cms' (novo-cms-payload/next.config.ts): TODAS as rotas dele — painel,
# API e /_next/static — já nascem sob /cms. Por isso o proxy_pass NÃO tem URI: o prefixo segue para o Payload.
# Tudo fora de /cms (o site Astro, /painel, /api/licitacoes…) segue exatamente como estava.
#
# IP real do cliente (real_ip_header X-Forwarded-For) vem do server{} do portal; sem ele o limite de login abaixo seria um
# contador único para todo mundo.

# $esquema_publico (do X-Forwarded-Proto do Caddy), não o esquema da conexão interna: um "return 301 /cms/admin" gera
# http://host:porta/… e rebaixaria o navegador de https para http.
location = /cms { return 301 $esquema_publico://$host/cms/admin; }

# Prefixo com ^~: vence as regras por expressão regular do site público. Os location aninhados valem só dentro dele.
location ^~ /cms/ {
    # Painel administrativo não entra em buscador. (add_header num location substitui os do server: repetimos os necessários.)
    add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header Referrer-Policy        "same-origin"                  always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=()" always;
    # Sem CSP própria: o Payload/Next injeta scripts em linha; impor uma aqui quebra o painel.

    # QUANDO HOUVER a faixa de saída da TrustIT/Prefeitura, restringir o painel a ela (com o real_ip isto já funciona):
    # allow <faixa>;
    # deny  all;

    limit_conn conexoes 20;
    client_max_body_size 200m;   # uploads de editais; o nginx.conf global ainda pode estar em 50m

    # Credenciais são o alvo de força bruta: contador por IP REAL, bem mais apertado que o geral.
    # (O Payload ainda bloqueia a CONTA após 5 erros, por 15 minutos.)
    location ~ ^/cms/api/users/(login|forgot-password|reset-password|first-register)$ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/proxy.conf;
    }

    # GraphQL (e seu playground) não é usado por ninguém: não ficar exposto.
    location ^~ /cms/api/graphql { return 404; }

    limit_req zone=geral burst=60 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/proxy.conf;
}
