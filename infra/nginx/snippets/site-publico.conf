# Corpo do site público (Astro SSR + arquivos do Directus).
# Fica num snippet porque é servido em DUAS portas: na 80 (como está hoje,
# atrás do proxy 10.180.0.13, com o TLS terminando na Cloudflare) e, se um dia
# o TLS de origem for ativado, na 443. Duplicar isso garantiria divergência.

include /etc/nginx/snippets/seguranca.conf;

limit_req  zone=geral burst=60 nodelay;
limit_conn conexoes 40;

# Enquanto o Astro não existe (Fase 2), o 502 vira página de implantação.
error_page 502 503 504 /_manutencao.html;
location = /_manutencao.html {
    root /var/www/portal;
    internal;
}

# Verificação de saúde do proxy: responde sem depender do Astro estar de pé.
location = /_saude {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Desafio ACME. Hoje inalcançável de fora (a Cloudflare entrega este caminho ao
# portal antigo, não a nós) — fica pronto para o dia da virada de DNS.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    access_log off;
}

# --- Painel de contribuição das secretarias (Fase 3) ---
# Fica no domínio público de propósito: quem alimenta o portal são servidores
# das secretarias, que trabalham de redes variadas. O que NÃO está aqui é o
# painel do Directus — esse continua só em admin., restrito à faixa da TrustIT.
location ^~ /painel {
    # 26m e não os 50m gerais: a inspeção do portal recusa acima de 25 MiB de
    # qualquer jeito. Cortar aqui evita subir 50 MB para reprovar no fim.
    client_max_body_size 26m;
    # Sem mexer nos timeouts do proxy.conf (60s): o Nginx bufferiza o corpo
    # inteiro antes de repassar, então a lentidão da rede da secretaria fica
    # entre o navegador e o Nginx. O que corre contra os 60s é só o trabalho do
    # portal — inspeção, ClamAV (teto de 30s) e gravação no CMS.

    # Definir add_header aqui SUBSTITUI os herdados do seguranca.conf — é assim
    # que o Nginx funciona. Por isso a lista vem repetida, com uma diferença
    # deliberada: X-Frame-Options não entra, porque a aplicação já manda DENY
    # (mais restrito que o SAMEORIGIN do site) e dois cabeçalhos iguais com
    # valores diferentes é comportamento indefinido no navegador.
    add_header X-Content-Type-Options     "nosniff"      always;
    add_header Referrer-Policy            "same-origin"  always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"  always;

    limit_req  zone=geral burst=20 nodelay;
    limit_conn conexoes 10;

    # A tela de entrada é o alvo de força bruta do painel: mesmo limite
    # apertado que o /auth/login do Directus.
    location = /painel/entrar {
        limit_req zone=login burst=3 nodelay;
        client_max_body_size 8k;
        add_header X-Content-Type-Options     "nosniff"      always;
        add_header Referrer-Policy            "same-origin"  always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin"  always;
        proxy_pass http://127.0.0.1:4321;
        include /etc/nginx/snippets/proxy.conf;
    }

    proxy_pass http://127.0.0.1:4321;
    include /etc/nginx/snippets/proxy.conf;
}

location / {
    proxy_pass http://127.0.0.1:4321;
    include /etc/nginx/snippets/proxy.conf;
}

# Arquivos servidos pelo Directus (imagens de notícias, documentos).
location /assets/ {
    proxy_pass http://127.0.0.1:8055/assets/;
    include /etc/nginx/snippets/proxy.conf;
    proxy_cache_valid 200 1h;
    expires 7d;
    add_header Cache-Control "public";
}

# O painel do Directus não se acessa pelo domínio público.
location /admin { return 404; }
