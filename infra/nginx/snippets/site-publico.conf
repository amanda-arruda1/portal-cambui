# Corpo do site público (Astro SSR + painel /cms).
# Fica num snippet porque é servido em DUAS portas: na 80 (como está hoje,
# atrás do proxy 10.180.0.13, com o TLS terminando na Cloudflare) e, se um dia
# o TLS de origem for ativado, na 443. Duplicar isso garantiria divergência.

include /etc/nginx/snippets/seguranca.conf;

limit_req  zone=geral burst=60 nodelay;
limit_conn conexoes 40;

# Enquanto o Astro não existe (Fase 2), o 502 vira página de implantação.
error_page 502 503 504 /_manutencao.html;
location = /_manutencao.html {
    root /var/www/portal;
    internal;
}

# Verificação de saúde do proxy: responde sem depender do Astro estar de pé.
location = /_saude {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Desafio ACME. Hoje inalcançável de fora (a Cloudflare entrega este caminho ao
# portal antigo, não a nós) — fica pronto para o dia da virada de DNS.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    access_log off;
}

# O /painel antigo foi desligado (2026-10-16): o Astro redireciona /painel* para /cms/admin.

location / {
    proxy_pass http://127.0.0.1:4321;
    include /etc/nginx/snippets/proxy.conf;
}

# Rotas de painéis antigos não existem mais (o painel é o /cms/admin).
location /admin { return 404; }
