# Parâmetros de TLS comuns a todos os sites.
# Só cifras ECDHE — evita precisar gerar dhparam e mantém perfect forward secrecy.

ssl_protocols              TLSv1.2 TLSv1.3;
ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers  off;   # com TLS1.3 a escolha do cliente é a melhor
ssl_session_cache          shared:TLS:10m;
ssl_session_timeout        1d;
ssl_session_tickets        off;

# OCSP stapling deliberadamente ausente: a Let's Encrypt desativou seus
# respondedores OCSP e não emite mais certificados com essa URL — habilitar
# 'ssl_stapling' só produziria aviso a cada recarga, sem efeito nenhum.
# A revogação hoje se apoia em CRL, tratada pelo navegador.
