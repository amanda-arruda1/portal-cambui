# Cabeçalhos repassados ao upstream (Astro/Directus rodando em 127.0.0.1).
# Sem estes, a aplicação gera URLs http:// e enxerga todo mundo como 127.0.0.1.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# $esquema_publico, não $scheme: o último salto até nós é http, mas o cidadão
# falou https com a Cloudflare. Usar $scheme aqui faria o Astro e o Directus
# montarem links http:// e o Directus recusar cookies 'secure'.
proxy_set_header X-Forwarded-Proto $esquema_publico;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_buffering       on;
proxy_buffer_size     16k;
proxy_buffers         8 16k;
