# Cabeçalhos de segurança aplicados aos sites públicos.
# HSTS fica de fora daqui de propósito: só entra depois que o certificado
# estiver emitido e validado, porque é uma decisão difícil de reverter
# (o navegador do cidadão passa a recusar http:// por um ano).

add_header X-Content-Type-Options   "nosniff"            always;
add_header X-Frame-Options          "SAMEORIGIN"         always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"      always;
