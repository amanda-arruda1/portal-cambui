# Portal Cambuí — atendimento na porta 80, ATRÁS DO PROXY.
#
# Este é o arquivo que serve o site de verdade hoje. Não é um trampolim para
# o HTTPS: o TLS público termina na Cloudflare e chega aqui como HTTP simples,
# vindo só de 10.180.0.13.
#
# POR QUE NÃO HÁ MAIS 'return 301 https://$host':
#   A Cloudflare já entrega o cidadão em https e nos repassa a requisição em
#   http. Um redirect para https aqui devolveria o cidadão à Cloudflare, que
#   nos repassaria em http de novo — laço infinito (ERR_TOO_MANY_REDIRECTS).
#   O redirect http->https é responsabilidade da borda: ativar "Always Use
#   HTTPS" no painel da Cloudflare, não aqui.

# --- Apex: manda para o www, preservando o esquema visto pelo cidadão ---
server {
    listen      80;
    listen      [::]:80;
    server_name prefeituradecambui.mg.gov.br;

    location = /_saude { access_log off; default_type text/plain; return 200 "ok\n"; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    return 301 $esquema_publico://www.prefeituradecambui.mg.gov.br$request_uri;
}

# --- Portal público (Astro SSR) ---
server {
    listen      80;
    listen      [::]:80;
    server_name www.prefeituradecambui.mg.gov.br;

    include /etc/nginx/snippets/site-publico.conf;
}

# --- Painel administrativo (Directus) ---
server {
    listen      80;
    listen      [::]:80;
    server_name admin.prefeituradecambui.mg.gov.br;

    include /etc/nginx/snippets/site-admin.conf;
}

# Qualquer outro Host (varredura por IP, domínio errado) morre aqui — menos a
# verificação de saúde, senão um health check por IP marcaria a VM como fora.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location = /_saude { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 444; }
}
