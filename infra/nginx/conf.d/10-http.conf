# Portal Cambuí — atendimento na porta 80, ATRÁS DO PROXY.
#
# Este é o arquivo que serve o site de verdade hoje. Não é um trampolim para
# o HTTPS: o TLS público termina na Cloudflare e chega aqui como HTTP simples,
# vindo só de 10.180.0.13.
#
# POR QUE NÃO HÁ MAIS 'return 301 https://$host':
#   A Cloudflare já entrega o cidadão em https e nos repassa a requisição em
#   http. Um redirect para https aqui devolveria o cidadão à Cloudflare, que
#   nos repassaria em http de novo — laço infinito (ERR_TOO_MANY_REDIRECTS).
#   O redirect http->https é responsabilidade da borda: ativar "Always Use
#   HTTPS" no painel da Cloudflare, não aqui.

# --- Apex: manda para o www, preservando o esquema visto pelo cidadão ---
server {
    listen      80;
    listen      [::]:80;
    server_name prefeituradecambui.mg.gov.br;

    location = /_saude { access_log off; default_type text/plain; return 200 "ok\n"; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    return 301 $esquema_publico://www.prefeituradecambui.mg.gov.br$request_uri;
}

# --- Portal público (Astro SSR) ---
server {
    listen      80;
    listen      [::]:80;
    server_name www.prefeituradecambui.mg.gov.br;

    include /etc/nginx/snippets/site-publico.conf;
}

# --- Painel administrativo (Directus) ---
server {
    listen      80;
    listen      [::]:80;
    server_name admin.prefeituradecambui.mg.gov.br;

    include /etc/nginx/snippets/site-admin.conf;
}

# --- Homologação: portal.cambui.mg.gov.br ---
#
# Nome que já existia quando chegamos, criado fora do projeto. O caminho real é:
#
#   navegador → NAT 177.10.44.44 → Caddy em 10.180.0.13 (termina o TLS com
#   certificado Let's Encrypt próprio) → esta VM :80
#
# ATENÇÃO — ISTO NÃO É INTERNO. O nome resolve na INTERNET PÚBLICA para
# 177.10.44.44 (DNS de horizonte dividido: dentro da rede aponta para
# 10.180.5.110 e 10.180.0.13). Qualquer pessoa alcança. Enquanto o portal antigo
# for o site oficial, este endereço serve uma versão em construção do site do
# município — daí o noindex e o robots.txt fechado abaixo.
#
# Antes disto o Nginx respondia 444 (o default_server), e o Caddy traduzia esse
# silêncio em 502. Estava no log: uma tentativa de navegador às 18:39 de
# 27/08/2026.
server {
    listen      80;
    listen      [::]:80;
    server_name portal.cambui.mg.gov.br;

    # Fora dos buscadores enquanto o oficial for o portal antigo. Duas travas,
    # porque uma só não cobre tudo: o cabeçalho vale para o HTML servido pelo
    # Astro, e o robots.txt vale para o rastreamento inteiro, inclusive PDFs
    # servidos por /assets/ — que têm add_header próprio e não herdam este.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Vence o 'location /' do site-publico.conf por ser correspondência exata,
    # então substitui o robots.txt que o Astro geraria.
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    include /etc/nginx/snippets/site-publico.conf;
}

# Qualquer outro Host (varredura por IP, domínio errado) morre aqui — menos a
# verificação de saúde, senão um health check por IP marcaria a VM como fora.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location = /_saude { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 444; }
}
