# Porta 80. Este arquivo é válido SEM certificado nenhum — é ele que permite
# ao Certbot validar o domínio pelo desafio HTTP-01 na primeira emissão.
#
# Tudo que não for /.well-known/acme-challenge/ é redirecionado para HTTPS.

server {
    listen      80;
    listen      [::]:80;
    server_name www.prefeituradecambui.mg.gov.br
                prefeituradecambui.mg.gov.br
                admin.prefeituradecambui.mg.gov.br;

    # Único caminho servido em texto claro.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Qualquer outro Host (varredura por IP, domínio errado) morre aqui.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return 444;
}
