# Portal Cambuí — configuração principal do Nginx (pacote nginx.org stable).
# Substitui o /etc/nginx/nginx.conf que vem do pacote.

user  nginx;
worker_processes  auto;
# Acompanha o worker_connections abaixo; sem isto o Nginx avisa que o limite
# de descritores do processo é menor que o de conexões.
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Loga o tempo de resposta do upstream: é o que denuncia lentidão do Astro
    # ou do Directus antes que o cidadão reclame.
    log_format  principal  '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" rt=$request_time urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  principal;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;          # não anunciar a versão do Nginx

    client_max_body_size 50m;     # acompanha o FILES_MAX_UPLOAD_SIZE do Directus
    client_body_timeout  30s;
    client_header_timeout 30s;
    send_timeout         30s;
    large_client_header_buffers 4 16k;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # Exigido pelo snippets/proxy.conf: sem este map, $connection_upgrade fica
    # indefinido e o Nginx nem carrega a configuração.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Zonas de limite. Aplicadas nos server blocks, não aqui.
    # 'login' protege o painel; 'geral' segura varredura automatizada.
    limit_req_zone  $binary_remote_addr  zone=login:10m  rate=5r/m;
    limit_req_zone  $binary_remote_addr  zone=geral:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr  zone=conexoes:10m;

    # Se um dia houver WAF/balanceador na frente, descomentar e ajustar a faixa,
    # senão todo log e todo rate limit enxergam um IP só.
    # set_real_ip_from  10.180.0.0/21;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
