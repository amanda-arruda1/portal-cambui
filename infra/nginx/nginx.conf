# Portal Cambuí — configuração principal do Nginx (pacote nginx.org stable).
# Substitui o /etc/nginx/nginx.conf que vem do pacote.
#
# TOPOLOGIA (levantada em 2026-08-27):
#   cidadão -> Cloudflare (termina o TLS público) -> proxy 10.180.0.13 -> esta VM
# A VM NÃO é alcançada direto da internet. Só o proxy 10.180.0.13 bate aqui, e
# hoje só na porta 80, em texto claro. Tudo abaixo parte disso.

user  nginx;
worker_processes  auto;
# Acompanha o worker_connections abaixo; sem isto o Nginx avisa que o limite
# de descritores do processo é menor que o de conexões.
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------
    # IP real do cidadão
    # ------------------------------------------------------------------
    # Sem isto, TODA requisição chega como 10.180.0.13: o log vira inútil e,
    # pior, o rate limit passa a contar o proxy inteiro como um cliente só —
    # um visitante ativo derrubaria o site para todos os outros.
    #
    # Confiamos APENAS no IP do proxy. Como o firewalld só aceita a 80 vinda
    # dele, ninguém mais consegue forjar estes cabeçalhos.
    set_real_ip_from  10.180.0.13;
    real_ip_header    CF-Connecting-IP;   # a Cloudflare sempre envia este
    real_ip_recursive on;

    # Esquema com que o cidadão falou com a Cloudflare (https), não o esquema
    # do último salto (http). É o que a aplicação precisa para montar URLs.
    # Ordem: X-Forwarded-Proto -> CF-Visitor -> esquema local.
    map $http_cf_visitor $esquema_cf {
        default  $scheme;
        ~https   https;
    }
    map $http_x_forwarded_proto $esquema_publico {
        default  $esquema_cf;
        https    https;
        http     http;
    }

    # Loga o tempo de resposta do upstream: é o que denuncia lentidão do Astro
    # ou do Directus antes que o cidadão reclame. 'via' mostra o salto anterior
    # (o proxy), para distinguir tráfego legítimo de acesso direto na rede.
    log_format  principal  '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" rt=$request_time urt="$upstream_response_time" '
                           'via=$realip_remote_addr esq=$esquema_publico';
    access_log  /var/log/nginx/access.log  principal;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;          # não anunciar a versão do Nginx

    client_max_body_size 200m;    # acompanha o FILES_MAX_UPLOAD_SIZE do Directus
    client_body_timeout  30s;
    client_header_timeout 30s;
    send_timeout         30s;
    large_client_header_buffers 4 16k;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # Exigido pelo snippets/proxy.conf: sem este map, $connection_upgrade fica
    # indefinido e o Nginx nem carrega a configuração.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Zonas de limite. Aplicadas nos server blocks, não aqui.
    # 'login' protege o painel; 'geral' segura varredura automatizada.
    # Só fazem sentido junto do set_real_ip_from acima.
    limit_req_zone  $binary_remote_addr  zone=login:10m  rate=5r/m;
    limit_req_zone  $binary_remote_addr  zone=geral:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr  zone=conexoes:10m;

    # 429 e não o 503 padrão. Dois motivos:
    #   1. semântica — 503 diz "o servidor caiu", 429 diz "você está indo rápido
    #      demais"; só o segundo é verdade, e é o que um cliente HTTP entende
    #      para esperar antes de repetir;
    #   2. o site público tem 'error_page 502 503 504 /_manutencao.html'. Com o
    #      503, quem esbarrasse no limite receberia a página de "portal em
    #      implantação" — mensagem errada, e alarmante para o cidadão.
    limit_req_status  429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
